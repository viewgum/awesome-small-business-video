name: links
on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node test.mjs
  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # ftc.gov refuses scripted requests (sources.json notes how it was read); 429 is a rate limit, not a dead page.
          args: --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30 --accept 200..=299,429 --exclude '^https://www\.ftc\.gov/' README.md CONTRIBUTING.md llms.txt
          fail: true
